<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bauteilübersicht – EINHAUS</title>
<style>
  :root {
    --bg:        #0e1621;
    --panel:     #16202e;
    --panel-2:   #1b2634;
    --feld:      #101825;
    --rand:      #2a3646;
    --rand-hell: #35455a;
    --text:      #e6ebf2;
    --text-dim:  #8a97a8;
    --akzent:    #3b82f6;
    --rot:       #ef4444;
    --gelb:      #f59e0b;
    --gruen:     #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    font-size: 14px;
  }

  /* ---------- Topbar ---------- */
  .topbar {
    background: var(--panel);
    border-bottom: 1px solid var(--rand);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 58px;
    position: sticky; top: 0; z-index: 100;
    flex-wrap: wrap;
  }
  .tb-left { display: flex; align-items: center; gap: 14px; }
  .tb-title { font-size: 19px; font-weight: 600; letter-spacing: .2px; }
  .tb-title .marke { color: var(--akzent); font-weight: 700; }
  .tb-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; }
  .btn-back {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-dim); text-decoration: none; font-size: 13px;
    border: 1px solid var(--rand-hell); border-radius: 20px; padding: 6px 13px;
    transition: .15s;
  }
  .btn-back:hover { color: var(--text); border-color: var(--akzent); }
  #suche {
    background: var(--feld); border: 1px solid var(--rand-hell); border-radius: 20px;
    padding: 8px 14px; color: var(--text); font-size: 13px; font-family: inherit; width: 220px;
  }
  #suche:focus { outline: none; border-color: var(--akzent); box-shadow: 0 0 0 2px rgba(59,130,246,.25); }
  #filterKunde {
    background: var(--feld); border: 1px solid var(--rand-hell); border-radius: 20px;
    padding: 8px 14px; color: var(--text); font-size: 13px; font-family: inherit; max-width: 180px;
  }
  #filterKunde:focus { outline: none; border-color: var(--akzent); box-shadow: 0 0 0 2px rgba(59,130,246,.25); }
  #filterKunde option { background: var(--panel-2); color: var(--text); }
  .tb-count { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .btn {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--rand-hell); border-radius: 7px;
    padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: .15s; white-space: nowrap;
  }
  .btn:hover { background: #24344a; border-color: #46596f; }
  .btn.primary { background: var(--akzent); border-color: var(--akzent); color: #fff; }
  .btn.primary:hover { background: #2f6fd8; }
  .btn.gefahr { color: var(--rot); }
  .btn.gefahr:hover { background: rgba(239,68,68,.15); border-color: var(--rot); }

  /* ---------- Layout ---------- */
  .wrap { max-width: 1280px; margin: 22px auto 60px; padding: 0 18px; }
  .leer-hinweis {
    text-align: center; color: var(--text-dim); padding: 60px 20px; font-size: 15px;
    border: 1px dashed var(--rand-hell); border-radius: 10px;
  }

  /* ---------- Bauteil-Grid ---------- */
  .bauteil-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .karte {
    background: var(--panel); border: 1px solid var(--rand); border-radius: 10px;
    overflow: hidden; cursor: pointer; transition: .15s; display: flex; flex-direction: column;
  }
  .karte:hover { border-color: var(--akzent); box-shadow: 0 4px 16px rgba(59,130,246,.15); transform: translateY(-2px); }
  .karte-fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rand); }
  .karte-foto-box { position: relative; background: var(--feld); aspect-ratio: 4/3; overflow: hidden; }
  .karte-foto-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .karte-foto-box .platzhalter {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    color: #3d4a5c; font-size: 28px;
  }
  .karte-foto-label {
    position: absolute; bottom: 0; left: 0; right: 0; background: rgba(14,22,33,.75);
    color: var(--text-dim); font-size: 9.5px; text-transform: uppercase; letter-spacing: .6px;
    padding: 3px 7px;
  }
  .karte-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .karte-titel { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .karte-kunde { font-size: 11px; color: var(--akzent); font-weight: 600; letter-spacing: .3px; }
  .karte-info { font-size: 12.5px; color: var(--text-dim); line-height: 1.45; max-height: 3.2em; overflow: hidden; }
  .karte-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .pill {
    background: var(--feld); border: 1px solid var(--rand-hell); border-radius: 20px;
    padding: 4px 10px; font-size: 11.5px; color: var(--text-dim); display: inline-flex; align-items: center; gap: 5px;
  }
  .pill b { color: var(--text); font-weight: 700; }
  .pill.akzent { border-color: var(--akzent); color: #bcd6ff; }
  .pill.akzent b { color: #fff; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(5,9,14,.72);
    z-index: 200; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 30px 14px;
  }
  .modal-overlay.offen { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--rand); border-radius: 12px;
    width: 100%; max-width: 640px; overflow: hidden;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--rand); background: var(--panel-2);
    font-size: 15px; font-weight: 700;
  }
  .modal-close {
    background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 6px;
  }
  .modal-close:hover { color: #fff; background: rgba(239,68,68,.25); }
  .modal-body { padding: 18px 20px; max-height: 70vh; overflow-y: auto; }
  .modal-foot {
    display: flex; align-items: center; gap: 10px; padding: 14px 20px;
    border-top: 1px solid var(--rand); background: var(--panel-2);
  }

  .grid { display: grid; gap: 14px 16px; }
  .g2 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px) { .g2 { grid-template-columns: 1fr; } }
  .span2 { grid-column: span 2; }
  @media (max-width: 560px) { .span2 { grid-column: span 1; } }

  label.f {
    display: block; font-size: 10.5px; font-weight: 700; color: var(--text-dim);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: .8px;
  }
  input[type=text], input[type=number], textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--rand-hell); border-radius: 6px;
    font-family: inherit; font-size: 14px; background: var(--feld); color: var(--text);
  }
  input::placeholder, textarea::placeholder { color: #5d6b7d; }
  input:focus, textarea:focus { outline: none; border-color: var(--akzent); box-shadow: 0 0 0 2px rgba(59,130,246,.25); }
  textarea { resize: vertical; min-height: 56px; line-height: 1.45; }
  .hint { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; }

  .foto-slot {
    border: 1px dashed var(--rand-hell); border-radius: 9px; background: var(--feld);
    aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative; color: var(--text-dim); font-size: 13px; text-align: center;
  }
  .foto-slot img { width: 100%; height: 100%; object-fit: cover; }
  .foto-slot .entfernen {
    position: absolute; top: 6px; right: 6px; background: rgba(239,68,68,.9); color: #fff;
    border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  .foto-btns { display: flex; gap: 8px; margin-top: 8px; }
  .foto-btns .btn { flex: 1; padding: 7px 10px; font-size: 12.5px; }

  @media (max-width: 720px) {
    .tb-right { width: 100%; justify-content: flex-start; }
    #suche { width: 160px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-left">
    <a class="btn-back" href="../index.html">← Dashboard</a>
    <div class="tb-title"><span class="marke">EINHAUS</span> Bauteilübersicht</div>
  </div>
  <div class="tb-right">
    <input id="suche" type="text" placeholder="🔍 Bauteil suchen…" oninput="render()">
    <select id="filterKunde" onchange="render()">
      <option value="">Alle Kunden</option>
    </select>
    <span class="tb-count" id="tbCount"></span>
    <button class="btn" onclick="exportieren()">⇩ Export</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">⇧ Import</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importieren(event)">
    <button class="btn primary" onclick="neuesBauteil()">+ Neues Bauteil</button>
  </div>
</div>

<div class="wrap">
  <div id="grid" class="bauteil-grid"></div>
  <div id="leer" class="leer-hinweis" style="display:none">Noch keine Bauteile erfasst. Mit „+ Neues Bauteil" starten.</div>
</div>

<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this) modalSchliessen()">
  <div class="modal">
    <div class="modal-head">
      <span id="modalTitel">Neues Bauteil</span>
      <button class="modal-close" onclick="modalSchliessen()">✕</button>
    </div>
    <div class="modal-body">
      <div class="grid g2">
        <div class="span2">
          <label class="f">Bezeichnung *</label>
          <input type="text" id="fBezeichnung" placeholder="z. B. Stoßfänger vorne RH">
        </div>
        <div class="span2">
          <label class="f">Kunde</label>
          <input type="text" id="fKunde" placeholder="z. B. Rehau" list="kundenListe">
          <datalist id="kundenListe"></datalist>
        </div>
        <div class="span2">
          <label class="f">Info zum Bauteil</label>
          <textarea id="fInfo" placeholder="Material, Besonderheiten, Lackaufbau-Hinweis, ..."></textarea>
        </div>
        <div>
          <label class="f">Vorhandene Gestelle (Stück)</label>
          <input type="number" min="0" id="fAnzahlGestelle" placeholder="z. B. 12" oninput="kabinenHinweisAktualisieren()">
        </div>
        <div>
          <label class="f">Bauteile je Gestell</label>
          <input type="number" min="0" id="fBauteileJeGestell" placeholder="z. B. 4" oninput="kabinenHinweisAktualisieren()">
        </div>
        <div class="span2">
          <label class="f">Kabinenbestückung – Gestelle je Durchlauf</label>
          <input type="number" min="0" id="fKabinenGestelle" placeholder="z. B. 3" oninput="kabinenHinweisAktualisieren()">
          <div class="hint" id="kabinenHinweis"></div>
        </div>
      </div>

      <div class="grid g2" style="margin-top:16px">
        <div>
          <label class="f">Foto Bauteil</label>
          <div class="foto-slot" id="slotBauteil"><span>Kein Foto</span></div>
          <div class="foto-btns">
            <button class="btn" type="button" onclick="triggerFoto('bauteil','camera')">📷 Kamera</button>
            <button class="btn" type="button" onclick="triggerFoto('bauteil','file')">📁 Datei</button>
          </div>
          <input type="file" accept="image/*" capture="environment" id="inpBauteilCam" style="display:none" onchange="fotoGewaehlt(event,'bauteil')">
          <input type="file" accept="image/*" id="inpBauteilFile" style="display:none" onchange="fotoGewaehlt(event,'bauteil')">
        </div>
        <div>
          <label class="f">Foto Gestell</label>
          <div class="foto-slot" id="slotGestell"><span>Kein Foto</span></div>
          <div class="foto-btns">
            <button class="btn" type="button" onclick="triggerFoto('gestell','camera')">📷 Kamera</button>
            <button class="btn" type="button" onclick="triggerFoto('gestell','file')">📁 Datei</button>
          </div>
          <input type="file" accept="image/*" capture="environment" id="inpGestellCam" style="display:none" onchange="fotoGewaehlt(event,'gestell')">
          <input type="file" accept="image/*" id="inpGestellFile" style="display:none" onchange="fotoGewaehlt(event,'gestell')">
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn gefahr" id="btnLoeschen" onclick="bauteilLoeschen()" style="display:none">🗑 Löschen</button>
      <div style="flex:1"></div>
      <button class="btn" onclick="modalSchliessen()">Abbrechen</button>
      <button class="btn primary" onclick="bauteilSpeichern()">Speichern</button>
    </div>
  </div>
</div>

<script>
  const DB_NAME = 'bauteiluebersicht_db';
  const STORE = 'bauteile';
  let db = null;
  let alleBauteile = [];
  let aktuelleId = null;
  let fotoBauteilData = null;
  let fotoGestellData = null;

  function dbOeffnen() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        req.result.createObjectStore(STORE, { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function dbAlleLaden() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function dbSpeichern(record) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(record);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function dbLoeschen(id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function init() {
    db = await dbOeffnen();
    alleBauteile = await dbAlleLaden();
    kundenlisteAktualisieren();
    render();
  }

  function kundenlisteAktualisieren() {
    const kunden = [...new Set(alleBauteile.map(b => b.kunde).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'de'));
    const filterSelect = document.getElementById('filterKunde');
    const bisherigeAuswahl = filterSelect.value;
    filterSelect.innerHTML = '<option value="">Alle Kunden</option>' +
      kunden.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('');
    if (kunden.includes(bisherigeAuswahl)) filterSelect.value = bisherigeAuswahl;

    document.getElementById('kundenListe').innerHTML =
      kunden.map(k => `<option value="${escapeHtml(k)}">`).join('');
  }

  function render() {
    const suchbegriff = document.getElementById('suche').value.trim().toLowerCase();
    const kundeFilter = document.getElementById('filterKunde').value;
    const gefiltert = alleBauteile
      .filter(b => !kundeFilter || (b.kunde || '') === kundeFilter)
      .filter(b => !suchbegriff ||
        b.bezeichnung.toLowerCase().includes(suchbegriff) ||
        (b.kunde || '').toLowerCase().includes(suchbegriff) ||
        (b.info || '').toLowerCase().includes(suchbegriff))
      .sort((a, b) => a.bezeichnung.localeCompare(b.bezeichnung, 'de'));

    const grid = document.getElementById('grid');
    const leer = document.getElementById('leer');
    document.getElementById('tbCount').textContent =
      alleBauteile.length ? `${alleBauteile.length} Bauteil(e)` : '';

    if (!gefiltert.length) {
      grid.innerHTML = '';
      leer.style.display = 'block';
      leer.textContent = alleBauteile.length
        ? 'Keine Treffer für die Suche.'
        : 'Noch keine Bauteile erfasst. Mit „+ Neues Bauteil" starten.';
      return;
    }
    leer.style.display = 'none';

    grid.innerHTML = gefiltert.map(b => {
      const gesamt = (b.anzahlGestelle || 0) * (b.bauteileJeGestell || 0);
      const kabineBauteile = (b.kabinenGestelle || 0) * (b.bauteileJeGestell || 0);
      return `
      <div class="karte" onclick="bauteilOeffnen('${b.id}')">
        <div class="karte-fotos">
          <div class="karte-foto-box">
            ${b.fotoBauteil ? `<img src="${b.fotoBauteil}">` : `<div class="platzhalter">🔧</div>`}
            <div class="karte-foto-label">Bauteil</div>
          </div>
          <div class="karte-foto-box">
            ${b.fotoGestell ? `<img src="${b.fotoGestell}">` : `<div class="platzhalter">🗄</div>`}
            <div class="karte-foto-label">Gestell</div>
          </div>
        </div>
        <div class="karte-body">
          <div class="karte-titel">${escapeHtml(b.bezeichnung)}</div>
          ${b.kunde ? `<div class="karte-kunde">${escapeHtml(b.kunde)}</div>` : ''}
          ${b.info ? `<div class="karte-info">${escapeHtml(b.info)}</div>` : ''}
          <div class="karte-stats">
            ${b.anzahlGestelle ? `<span class="pill">🗄 <b>${b.anzahlGestelle}</b> Gestelle</span>` : ''}
            ${b.bauteileJeGestell ? `<span class="pill">📦 <b>${b.bauteileJeGestell}</b> / Gestell</span>` : ''}
            ${gesamt ? `<span class="pill">Σ <b>${gesamt}</b> gesamt</span>` : ''}
            ${b.kabinenGestelle ? `<span class="pill akzent">🎯 <b>${b.kabinenGestelle}</b> Gestelle/Kabine${kabineBauteile ? ` = <b>${kabineBauteile}</b> Teile` : ''}</span>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function kabinenHinweisAktualisieren() {
    const jeGestell = parseInt(document.getElementById('fBauteileJeGestell').value) || 0;
    const kabineGestelle = parseInt(document.getElementById('fKabinenGestelle').value) || 0;
    const hinweis = document.getElementById('kabinenHinweis');
    if (jeGestell && kabineGestelle) {
      hinweis.textContent = `= ${jeGestell * kabineGestelle} Bauteile pro Kabinenfüllung`;
    } else {
      hinweis.textContent = 'Wie viele Gestelle gleichzeitig in die Lackierkabine passen.';
    }
  }

  function neuesBauteil() {
    aktuelleId = null;
    document.getElementById('modalTitel').textContent = 'Neues Bauteil';
    document.getElementById('btnLoeschen').style.display = 'none';
    document.getElementById('fBezeichnung').value = '';
    document.getElementById('fKunde').value = '';
    document.getElementById('fInfo').value = '';
    document.getElementById('fAnzahlGestelle').value = '';
    document.getElementById('fBauteileJeGestell').value = '';
    document.getElementById('fKabinenGestelle').value = '';
    fotoBauteilData = null;
    fotoGestellData = null;
    fotoSlotAktualisieren('bauteil');
    fotoSlotAktualisieren('gestell');
    kabinenHinweisAktualisieren();
    document.getElementById('modalOverlay').classList.add('offen');
  }

  function bauteilOeffnen(id) {
    const b = alleBauteile.find(x => x.id === id);
    if (!b) return;
    aktuelleId = id;
    document.getElementById('modalTitel').textContent = 'Bauteil bearbeiten';
    document.getElementById('btnLoeschen').style.display = 'inline-block';
    document.getElementById('fBezeichnung').value = b.bezeichnung || '';
    document.getElementById('fKunde').value = b.kunde || '';
    document.getElementById('fInfo').value = b.info || '';
    document.getElementById('fAnzahlGestelle').value = b.anzahlGestelle || '';
    document.getElementById('fBauteileJeGestell').value = b.bauteileJeGestell || '';
    document.getElementById('fKabinenGestelle').value = b.kabinenGestelle || '';
    fotoBauteilData = b.fotoBauteil || null;
    fotoGestellData = b.fotoGestell || null;
    fotoSlotAktualisieren('bauteil');
    fotoSlotAktualisieren('gestell');
    kabinenHinweisAktualisieren();
    document.getElementById('modalOverlay').classList.add('offen');
  }

  function modalSchliessen() {
    document.getElementById('modalOverlay').classList.remove('offen');
  }

  async function bauteilSpeichern() {
    const bezeichnung = document.getElementById('fBezeichnung').value.trim();
    if (!bezeichnung) {
      alert('Bitte eine Bezeichnung eingeben.');
      return;
    }
    const record = {
      id: aktuelleId || ('b_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8)),
      bezeichnung,
      kunde: document.getElementById('fKunde').value.trim(),
      info: document.getElementById('fInfo').value.trim(),
      anzahlGestelle: parseInt(document.getElementById('fAnzahlGestelle').value) || 0,
      bauteileJeGestell: parseInt(document.getElementById('fBauteileJeGestell').value) || 0,
      kabinenGestelle: parseInt(document.getElementById('fKabinenGestelle').value) || 0,
      fotoBauteil: fotoBauteilData,
      fotoGestell: fotoGestellData,
      geaendert: new Date().toISOString(),
    };
    if (!aktuelleId) record.erstellt = record.geaendert;
    else {
      const alt = alleBauteile.find(x => x.id === aktuelleId);
      record.erstellt = (alt && alt.erstellt) || record.geaendert;
    }

    await dbSpeichern(record);
    alleBauteile = await dbAlleLaden();
    kundenlisteAktualisieren();
    render();
    modalSchliessen();
  }

  async function bauteilLoeschen() {
    if (!aktuelleId) return;
    if (!confirm('Dieses Bauteil wirklich löschen?')) return;
    await dbLoeschen(aktuelleId);
    alleBauteile = await dbAlleLaden();
    kundenlisteAktualisieren();
    render();
    modalSchliessen();
  }

  function triggerFoto(typ, quelle) {
    const id = typ === 'bauteil'
      ? (quelle === 'camera' ? 'inpBauteilCam' : 'inpBauteilFile')
      : (quelle === 'camera' ? 'inpGestellCam' : 'inpGestellFile');
    document.getElementById(id).click();
  }

  function fotoGewaehlt(ev, typ) {
    const datei = ev.target.files[0];
    ev.target.value = '';
    if (!datei) return;
    verkleinerBild(datei).then(dataUrl => {
      if (typ === 'bauteil') fotoBauteilData = dataUrl;
      else fotoGestellData = dataUrl;
      fotoSlotAktualisieren(typ);
    });
  }

  function fotoEntfernen(typ, ev) {
    ev.stopPropagation();
    if (typ === 'bauteil') fotoBauteilData = null;
    else fotoGestellData = null;
    fotoSlotAktualisieren(typ);
  }

  function fotoSlotAktualisieren(typ) {
    const slot = document.getElementById(typ === 'bauteil' ? 'slotBauteil' : 'slotGestell');
    const data = typ === 'bauteil' ? fotoBauteilData : fotoGestellData;
    if (data) {
      slot.innerHTML = `<img src="${data}"><button type="button" class="entfernen" onclick="fotoEntfernen('${typ}', event)">✕</button>`;
    } else {
      slot.innerHTML = '<span>Kein Foto</span>';
    }
  }

  function verkleinerBild(datei, maxDim = 1280, qualitaet = 0.82) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
            else { width = Math.round(width * maxDim / height); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', qualitaet));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(datei);
    });
  }

  function exportieren() {
    const blob = new Blob([JSON.stringify(alleBauteile, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const heute = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `Bauteiluebersicht_${heute}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importieren(ev) {
    const datei = ev.target.files[0];
    ev.target.value = '';
    if (!datei) return;
    const reader = new FileReader();
    reader.onload = async () => {
      let daten;
      try { daten = JSON.parse(reader.result); }
      catch { alert('Ungültige Datei.'); return; }
      if (!Array.isArray(daten)) { alert('Ungültiges Format.'); return; }
      let anzahl = 0;
      for (const eintrag of daten) {
        if (!eintrag.id || !eintrag.bezeichnung) continue;
        await dbSpeichern(eintrag);
        anzahl++;
      }
      alleBauteile = await dbAlleLaden();
      kundenlisteAktualisieren();
      render();
      alert(`${anzahl} Bauteil(e) importiert.`);
    };
    reader.readAsText(datei);
  }

  init();
</script>

</body>
