<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>QR-Code – Rüstfreigabe Lackierkabinen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      padding: 48px 56px;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .header {
      border-bottom: 3px solid #1a3c5e;
      padding-bottom: 20px;
      margin-bottom: 28px;
    }

    .company {
      font-size: 11px;
      font-weight: 700;
      color: #888;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1a3c5e;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-top: 6px;
    }

    .qr-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 28px 0;
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
      border: 2px solid #e5e7eb;
    }

    #qrcode img, #qrcode canvas {
      border-radius: 4px;
    }

    .badge {
      display: inline-block;
      background: #1a3c5e;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .instruction {
      font-size: 14px;
      color: #374151;
      line-height: 1.6;
      margin-top: 20px;
    }

    .instruction strong {
      color: #1a3c5e;
    }

    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
      font-size: 11px;
      color: #9ca3af;
    }

    .url-display {
      font-size: 10px;
      color: #b0b0b0;
      word-break: break-all;
      margin-top: 8px;
      font-family: monospace;
    }

    /* ── PRINT ── */
    @media print {
      body { background: #fff; padding: 0; }
      .card {
        box-shadow: none;
        border: 2px solid #1a3c5e;
        border-radius: 8px;
        padding: 32px 40px;
        max-width: 100%;
      }
      .no-print { display: none; }
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="header">
      <div class="company">EINHAUS Oberflächenveredelung GmbH</div>
      <div class="title">📋 Rüstfreigabe<br>Lackierkabinen</div>
      <div class="subtitle">Lackierung · Industrielackierung</div>
    </div>

    <div class="badge">QR-Code scannen → Formular öffnen</div>

    <div class="qr-wrapper">
      <div id="qrcode"></div>
    </div>

    <div class="instruction">
      📱 Smartphone-Kamera auf den QR-Code richten<br>
      <strong>→ Rüstfreigabe-Formular öffnet sich automatisch</strong>
    </div>

    <div class="footer">
      Lackierung · Rüstfreigabe Lackierkabinen<br>
      <span class="url-display" id="url-text"></span>
    </div>

    <div class="no-print" style="margin-top:24px;">
      <button onclick="window.print()"
        style="background:#1a3c5e;color:#fff;border:none;padding:10px 28px;
               border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;">
        🖨️ Drucken / Als PDF speichern
      </button>
    </div>

  </div>

  <!-- QR-Code Bibliothek -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // ── URL die im QR-Code kodiert wird ──────────────────────────────────────
    // Hier die SharePoint-URL der Ruestfreigabe_Mobil.html eintragen:
    const QR_URL = "https://andreaslisin.github.io/ruestfreigabe/";

    // QR-Code generieren
    new QRCode(document.getElementById("qrcode"), {
      text:         QR_URL,
      width:        220,
      height:       220,
      colorDark:    "#1a3c5e",
      colorLight:   "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });

    // URL klein unter dem Code anzeigen
    document.getElementById("url-text").textContent = QR_URL;
  </script>

</body>
</html>
